name = "boltcard-poc"
main = "index.ts"
compatibility_date = "2026-06-10"
workers_dev = false

kv_namespaces = [
  { binding = "UID_CONFIG", id = "7eaddc7f33d242ed94054dfb8da8fcbc" }
]

# Rate limiting via KV is disabled by default. To enable, create a KV namespace
# and add: { binding = "RATE_LIMITS", id = "<your-namespace-id>" }
# The worker gracefully skips rate limiting when the binding is absent.

[vars]
CURRENCY_LABEL = "credits"
CURRENCY_DECIMALS = "0"
FAKEWALLET_CURRENCY = "EUR"
FAKEWALLET_IBAN = "GB33BUKB20201555555555"
FAKEWALLET_ACCOUNT_NAME = "FakeWallet"

routes = [
  "https://boltcardpoc.psbt.me/*"
]

[[durable_objects.bindings]]
name = "CARD_REPLAY"
class_name = "CardReplayStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CardReplayDO"]
# 2026-08-26 factory reset: v2 destroys all CardReplayDO storage (all data was
# fake/test — issue-era cleanup); v3 brings up the renamed class fresh.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["CardReplayStore"]

# 2026-08-26 factory reset: destroys all legacy CardReplayDO storage (every
# card row was fake/test data, keys re-derivable from keys/*.csv).
[[migrations]]
tag = "v3"
deleted_classes = ["CardReplayDO"]

[observability]
enabled = false
head_sampling_rate = 0

[observability.logs]
invocation_logs = false

[env.staging]
name = "boltcard-poc-staging"
workers_dev = false
routes = [
  "https://boltcard-staging.psbt.me/*"
]
kv_namespaces = [
  { binding = "UID_CONFIG", id = "b692f3eb3e2d4c11b57afae6713c0b2a" }
]

[env.staging.vars]
CURRENCY_LABEL = "credits"
CURRENCY_DECIMALS = "0"
FAKEWALLET_CURRENCY = "EUR"
FAKEWALLET_IBAN = "GB33BUKB20201555555555"
FAKEWALLET_ACCOUNT_NAME = "FakeWallet"
# Session K (ops#26) live-verification window — owner consent 2026-11-18
# (issue 26 comment): armed for the staged probes, removed at window end.
# Documented default-OFF flags (audit #10 / #18 / #13):
REPLAY_ENFORCE = "1"
ALLOWED_HOSTS = "boltcard-staging.psbt.me"
K1_FRESH = "1"
# Short TTL so the "expired challenge refused" probe is bounded (audit #13
# knob; default 60s). Removed together with the flags above.
K1_FRESH_TTL_SECONDS = "3"

[[env.staging.durable_objects.bindings]]
name = "CARD_REPLAY"
class_name = "CardReplayStore"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["CardReplayDO"]

[[env.staging.migrations]]
tag = "v2"
new_sqlite_classes = ["CardReplayStore"]

# 2026-08-26 factory reset: destroys all legacy CardReplayDO storage (every
# card row was fake/test data, keys re-derivable from keys/*.csv).
[[env.staging.migrations]]
tag = "v3"
deleted_classes = ["CardReplayDO"]

[env.staging.observability]
enabled = false
