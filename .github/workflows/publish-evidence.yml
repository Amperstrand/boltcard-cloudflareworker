name: Publish Evidence

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Pinned nak release — replaces the unauthenticated api.github.com
  # /releases/latest lookup that rate-limits and fails the job
  # (runs 44030708657 on 2026-11-17 and 2026-11-13T20:38 main).
  # Asset name pattern: nak-<tag>-linux-amd64. Bump deliberately.
  NAK_VERSION: v0.22.3
  NAK_SHA256: 2eb9a16f86c865275983459b2c705d22d5dfbcf527026a279449cbf204d164fe

jobs:
  publish:
    runs-on: ubuntu-latest
    needs: []
    steps:
      - uses: actions/checkout@v7
      - name: Clone ntag424-crypto
        run: git clone https://github.com/Amperstrand/ntag424-crypto.git ../ntag424-crypto
      - name: Build ntag424-crypto
        run: cd ../ntag424-crypto && npm install && npm run build

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install nak
        id: nak
        run: |
          url="https://github.com/fiatjaf/nak/releases/download/${NAK_VERSION}/nak-${NAK_VERSION}-linux-amd64"
          if curl -fsSL --retry 3 --retry-delay 5 "$url" -o /usr/local/bin/nak \
            && chmod +x /usr/local/bin/nak \
            && echo "${NAK_SHA256}  /usr/local/bin/nak" | sha256sum -c -; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            nak --version || true
          else
            rm -f /usr/local/bin/nak
            echo "::warning::nak ${NAK_VERSION} unavailable (${url}) — evidence publish will be skipped; tests and dashboard still run"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm install --frozen-lockfile
      - run: node scripts/sync-js-exports.mjs
      - run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        continue-on-error: true
        id: e2e
        run: npx playwright test --retries=1 --timeout=60000

      - name: Render dashboard
        if: always()
        run: node scripts/render-test-dashboard.mjs

      - name: Publish evidence
        if: always() && steps.nak.outputs.available == 'true'
        run: |
          mkdir -p ~/.config/prta
          echo "${{ secrets.PUBLISH_NSEC }}" > ~/.config/prta/nsec
          chmod 600 ~/.config/prta/nsec
          ACTUAL_NPUB="$(nak key public "$(cat ~/.config/prta/nsec)" 2>/dev/null || echo DERIVE_FAILED)"
          echo "Publisher npub: $ACTUAL_NPUB"
          if [ -n "$EXPECTED_NPUB" ] && [ "$ACTUAL_NPUB" != "$EXPECTED_NPUB" ]; then
            echo "WARNING: npub mismatch — got $ACTUAL_NPUB, expected $EXPECTED_NPUB"
            if [ "${STRICT_NPUB_CHECK:-0}" = "1" ]; then
              echo "::error::STRICT_NPUB_CHECK=1 — aborting to prevent silent identity drift"
              exit 1
            fi
          fi
          pip install certifi
          python3 scripts/publish/publish_evidence.py
        env:
          BLOSSOM_SERVER: https://blossom.psbt.me
          NOSTR_RELAYS: wss://relay.damus.io,wss://nos.lol
          EXPECTED_NPUB: ${{ vars.EXPECTED_NPUB }}
          STRICT_NPUB_CHECK: ${{ vars.STRICT_NPUB_CHECK }}

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results/dashboard/
          retention-days: 30
